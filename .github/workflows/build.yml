# Build and release logl.  Tag a version (git tag v2.1 && git push --tags) to publish a release.
# STATUS: reviewed and YAML-validated, but NOT executed on GitHub by its author. Run it once with
# "Run workflow" (workflow_dispatch) before relying on it; that run does not publish a release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Linux (static, musl)
  # Why musl and not glibc: a glibc "static" binary still loads libnss/libc pieces at run time for name
  # resolution (getaddrinfo, DNS, users), so it can break on another distro once the network layer exists.
  # musl links everything statically for real: one file, no libc needed on the target machine.
  # What changes: DNS is simpler (no /etc/nsswitch.conf, no NIS/LDAP), locale support is minimal,
  # and a few glibc-only extensions are missing. logl.c uses none of them (checked by reading, and by this job).
  # We compile inside an Alpine container with "docker run" instead of "container:" because JavaScript
  # actions (checkout, upload-artifact) do not run reliably inside Alpine.
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests folder present?
        shell: bash
        run: test -f tests/run.sh || { echo "::error::tests/run.sh not found. Commit the whole tests/ folder (and logl.c) at the repository root."; exit 1; }
      - name: Build (musl, static)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -c \
            "apk add --no-cache gcc musl-dev && gcc -O2 -static -s -o logl-linux logl.c -lm -lpthread"
          sudo chown "$USER" logl-linux
      - name: Check it is really static
        run: file logl-linux | tee /dev/stderr | grep -q "statically linked"
      - run: ./logl-linux --version
      - name: Test programs
        run: bash tests/run.sh ./logl-linux
      - name: Real UART test (pseudo-terminal)
        run: python3 tests/uart_pty.py ./logl-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: logl-linux

  # Linux ARM64 (Raspberry Pi 3/4/5 on a 64-bit OS, and similar boards).
  # I chose GitHub's native ARM runner (ubuntu-24.04-arm) instead of cross-compiling: the binary is built AND
  # tested on real ARM64, with no qemu. Limitation: ARM runners are free only for PUBLIC repositories; on a private
  # repo this job would need a paid larger runner (or cross-compilation with an aarch64 musl toolchain).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Tests folder present?
        shell: bash
        run: test -f tests/run.sh || { echo "::error::tests/run.sh not found. Commit the whole tests/ folder (and logl.c) at the repository root."; exit 1; }
      - name: Build (musl, static)
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -c \
            "apk add --no-cache gcc musl-dev && gcc -O2 -static -s -o logl-linux-arm64 logl.c -lm -lpthread"
          sudo chown "$USER" logl-linux-arm64
      - name: Check it is really static and ARM64
        run: file logl-linux-arm64 | tee /dev/stderr | grep -q "ARM aarch64" && file logl-linux-arm64 | grep -q "statically linked"
      - run: ./logl-linux-arm64 --version
      - name: Test programs
        run: bash tests/run.sh ./logl-linux-arm64
      - name: Real UART test (pseudo-terminal)
        run: python3 tests/uart_pty.py ./logl-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: logl-linux-arm64

  # ---------------------------------------------------------------- Windows
  # UCRT64 (default): needs the Universal C Runtime, which is part of Windows 10/11 (and 8.1/7 with updates).
  # For Windows 7/8 change `msystem: UCRT64` to `msystem: MINGW64` and the package to
  # `mingw-w64-x86_64-gcc` (links against msvcrt.dll, present on every Windows). Not tested on Windows 7/8.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Tests folder present?
        shell: bash
        run: test -f tests/run.sh || { echo "::error::tests/run.sh not found. Commit the whole tests/ folder (and logl.c) at the repository root."; exit 1; }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: gcc -O2 -static -s -o logl-windows.exe logl.c -lm -lpthread -lws2_32
      - run: ./logl-windows.exe --version
      - name: Test programs
        run: bash tests/run.sh ./logl-windows.exe
      - name: Diagnostics if the tests failed (a program that raises an error)
        if: failure()
        run: |
          ./logl-windows.exe tests/e02_undeclared_aug.log+ --no-window --plain --no-wait; echo "exit code: $?"
          ./logl-windows.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: logl-windows.exe

  # ---------------------------------------------------------------- macOS (universal: arm64 + x86_64)
  # macOS cannot link statically; the binary only depends on libSystem, which every Mac has.
  # (-s is obsolete in Apple's linker, so symbols are removed afterwards with strip.)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests folder present?
        shell: bash
        run: test -f tests/run.sh || { echo "::error::tests/run.sh not found. Commit the whole tests/ folder (and logl.c) at the repository root."; exit 1; }
      - run: clang -O2 -arch arm64 -arch x86_64 -o logl-macos logl.c -lm -lpthread
      - run: strip -x logl-macos
      - run: lipo -info logl-macos
      - run: ./logl-macos --version
      - name: Test programs
        run: bash tests/run.sh ./logl-macos
      - name: Real UART test (pseudo-terminal) - informative only on macOS
        continue-on-error: true
        run: python3 tests/uart_pty.py ./logl-macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: logl-macos

  # ---------------------------------------------------------------- release
  release:
    needs: [linux-x86_64, linux-arm64, windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums
        run: |
          cd dist
          sha256sum logl-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
