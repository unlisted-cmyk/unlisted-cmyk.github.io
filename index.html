<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#eceae4;--pn:#f7f6f2;--fg:#1d1c1a;--mu:#716e66;--ln:#d3d0c7;--ac:#b4570a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace}

#ol .err{color:#ff6b6b}#ol .wrn{color:#ffcf5c}#ol .ok{color:#7fe3a1}#ol .src{color:#8aa4c0}#ol .hint{color:#ffcf5c}#hdmi{padding:6px 12px;background:#0c1520;color:#7fe3a1;font-size:12px;letter-spacing:.08em;border-top:1px solid #1d2b3b}#dev{display:flex;gap:8px;padding:6px 12px;background:#0c1520}#pad{padding:6px 12px;display:flex;gap:8px;align-items:stretch}#pd{flex:1;height:84px;border:1px dashed #2a3b4f;border-radius:6px;color:#8aa4c0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;font-size:12px}#pad button{min-width:56px;padding:0 8px}#cur{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none}#vk{padding:6px 12px}#vk .vr{display:flex;gap:3px;margin-bottom:3px}#vk button{flex:1;padding:8px 0;min-width:0;font-size:12px}#ui{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px}#ui label{display:flex;gap:6px;align-items:center}#ui input[type=text],#ini{background:#0c1520;border:1px solid #2a3b4f;color:#cfe6ff;padding:5px 7px;border-radius:4px;min-width:0}#inw{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:#0c1520}#inw span{flex:1 1 100%;white-space:pre-wrap}#ini{flex:1}#sa{display:flex;gap:8px;padding:6px 12px;background:#241c0f}#san{flex:1;min-width:0;background:#000;border:1px solid #6b5220!important;color:#ffe2b0;padding:5px 7px;border-radius:4px}

</style></head><body>
<input type="file" id="upl" hidden multiple>
<div id="app">
<aside>
<div class="t">Log-SoC</div><div class="mu">no operating system</div>
<div class="r"><span>CPU 3.0 GHz</span><span id="cp">0%</span></div><div class="bar"><u id="cb"></u></div>

<main>
<div id="term"><div id="pr"><span>log@chip:~$ </span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal"></div></div>

</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const T=$('#term'),PR=$('#pr'),IN=$('#in'),ED=$('#ed'),EA=$('#ea'),OUT=$('#out'),OL=$('#ol'),CV=$('#cv'),cx=CV.getContext('2d');
let files=(()=>{try{return JSON.parse(localStorage.getItem('logfs')||'{}')}catch(_){return{}}})(),cur=null,R=null,res=null,t0=Date.now(),cpu=3,PIN=Array(32).fill(0),V={},TY={},CC={},port=null,wr=null,AC=null;
const add=(box,t,c,before)=>{const d=document.createElement('div');d.textContent=t;if(c)d.className=c;box.insertBefore(d,before||null);box.scrollTop=box.scrollHeight};
const pr=(t,c)=>add(T,t,c,PR),op=(t,c)=>add(OL,t,c);
const LG=/^<\s*(log\+\+|log\+-|log\+|log-|logall|log\*)\s*>$/i,norm=s=>(s=s.toLowerCase())==='log*'?'logall':s;
const TPL={
'log-':`<log->
// Log-: every pixel is written explicitly
Screen:Resolution("W;32","H;18","Bits;24")
Screen:Clear("Color;#101820")
Var:U8:r("Value;250")
Repeat(10)
{
    Set:r("Value;r+1")
}
Print("r (U8) overflowed and is now {r}")
For:i(0,18)
{
    Screen:Pixel(i,i)("Color;hsl;i*20")
}
Screen:Pixel(16,9)("Color;rgb;255;60;0")
Screen:Pixel(17,9)("Color;rgb;0;200;120")
Expect:Pixel(16,9)("Equals;R=255;G=60;B=0") Else:Halt("ERR_PIXEL")
Print("Pixel (16,9) verified")
`,
'log+':`<log+>
// Log+: short, with default values (320x180 screen)
Screen:Clear("Color;black")
Print("Drawing a spiral...")
For:i(0,300)
{
    Screen:Circle(160+i*0.45*cos(i/6),90+i*0.28*sin(i/6),2)("Color;hsl;i*1.2")
    Wait("ms;4")
}
Print("Done")
`,
'log++':`<log++>
// Log++: microcontroller style, no screen
Setup
{
    Pin:5("Input;PullDown")
    Pin:13("Output")
    Print("Setup done")
}
Loop
{
    Pin:13("Set;High")
    Wait("ms;300")
    Pin:13("Set;Low")
    Wait("ms;300")
}
`,
'log+-':`<log+->
#- Screen:Resolution("W;160","H;90","Bits;24")
#+ Screen:Clear("Color;black")
#+ Screen:Rect(20,20,120,50)("Color;rgb;255;60;0")
#- Expect:Pixel(30,30)("Equals;R=255;G=60;B=0") Else:Halt("ERR_PIXEL")
#+ Print("Log- and Log+ living together in one file")
`,
'logall':`<logall>
// Press START_BUTTON in the output panel
#++ Setup
{
    Pin:13("Output")
}
#- Screen:Resolution("W;160","H;90","Bits;24")
#+ Screen:Clear("Color;black")
#+ On:START_BUTTON("Press")
{
    Screen:Rect(20,20,120,50)("Color;rgb;255;60;0")
    #- Expect:Pixel(30,30)("Equals;R=255;G=60;B=0") Else:Halt("ERR_PIXEL")
    #++ Pin:13("Set;High")
    Print("Pixel painted and LED on")
}
`};
/* ---------- parser ---------- */
const KN=['use','print','var','set','repeat','for','if','wait','screen','display','reg','pin','on','loop','setup','expect','sound','serial','else','while','break','continue','input','ui','store','g3d','push','pop','remove','insert','sort','shuffle','each','def','call','return','elseif','console','mem','disk','exec','panic','stop','task','spawn','kill','join','import','try','lock','unlock','send','recv','yield','assert','sys','proc','surface','host','i2c'],OPS=['pixel','rect','line','circle','clear','resolution','text','blit','get'],TYP=['u8','u16','u32','i32','f32','f64','str'];
const CAST={u8:v=>v&255,u16:v=>v&65535,u32:v=>v>>>0,i32:v=>v|0,f32:v=>Math.fround(+v),f64:v=>+v,str:v=>String(v).slice(0,65535)};
function sp(s){const a=[];let d=0,q=0,b=0;for(let i=0;i<=s.length;i++){const c=s[i];if(c==='"')q^=1;if(!q){if(c==='('||c==='[')d++;if(c===')'||c===']')d--}if(i===s.length||(c===','&&!d&&!q)){a.push(s.slice(b,i).trim());b=i+1}}return a}
function grp(s){const g=[];let d=0,b=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(!d)return null;const j=s.indexOf('"',i+1);if(j<0)return null;i=j}else if(c==='('){if(d++===0)b=i+1}else if(c===')'){if(--d<0)return null;if(d===0)g.push(s.slice(b,i))}else if(!d&&c!==' ')return null}return d?null:g}
function stm(t,n,lg){let els=null;const ei=t.indexOf(' Else:');if(ei>0){els=t.slice(ei+6);t=t.slice(0,ei)}
const hm=t.match(/^[A-Za-z_][\w:]*/);if(!hm)return{n,lg,h:['?'],bad:1,why:'The line must start with the name of an instruction (see Appendix A)'};
const x={n,lg,h:hm[0].split(':'),els,a:[],q:[]},g=grp(t.slice(hm[0].length).trim());if(!g){x.bad=1;x.why=diag(t);return x}
g.forEach(s=>{if(s.includes('"'))(s.match(/"[^"]*"/g)||[]).forEach(m=>x.q.push(m.slice(1,-1)));else x.a=s.trim()?sp(s):[]});
x.o=x.q.map(s=>s.split(';').map(v=>v.trim()));return x}
function parse(src,name){const E=[],W=[],L=[];
src.split('\n').forEach((r,i)=>{let t=r.replace(/\/\/.*$/,'').trim();if(!t)return;if(t==='{'){L.length&&(L[L.length-1].o=1);return}let o=0;if(t.length>1&&t.endsWith('{')){t=t.slice(0,-1).trim();o=1}L.push({n:i+1,t,o})});
const h=L.shift(),hm=h&&h.t.match(LG);if(!hm){E.push([h?h.n:1,'Missing language header, for example <log+>']);return{E,W}}
const fl=norm(hm[1]),ext=name.split('.').pop();if(ext!==fl)W.push([h.n,`The header <${fl}> does not match the .${ext} extension`]);
let i=0,w=0;
const blk=(lg,ol)=>{const o=[];while(i<L.length){const x=L[i++];if(x.t==='}'){if(ol===undefined){E.push([x.n,'Brace } without its opening {','Missing { right after the instruction that opens this block (If, For, While, Def...)']);continue}return o}let t=x.t,l=lg;const tg=t.match(/^#(\+\+|\+|-)\s*(.*)$/);if(tg){l='log'+tg[1];t=tg[2]}else if(!l){l='log+';if(fl==='logall'&&!w++)W.push([x.n,'Line without a #-, #+ or #++ tag: #+ is assumed'])}const s=stm(t,x.n,l);if(x.o)s.body=blk(l,x.n);const hn=s.h[0].toLowerCase();
if(hn==='catch'){const q=o[o.length-1];if(q&&q.h[0].toLowerCase()==='try'&&!q.cat){q.cat=s.body||[];q.cv=s.h[1]||''}else E.push([x.n,'Catch without a Try right before it','Catch:error goes on its own line, right after the } of a Try']);continue}
if(hn==='else'||hn==='elseif'){let q=o[o.length-1];while(q&&q.alt&&q.alt.length===1&&q.alt[0].elif)q=q.alt[0];
if(q&&q.h[0].toLowerCase()==='if'&&!q.alt){if(hn==='else')q.alt=s.body||[];else{s.h=['If'];s.elif=1;q.alt=[s]}}
else E.push([x.n,hn==='else'?'Else without an If right before it':'ElseIf without an If right before it','It goes on its own line, right after the } of an If']);continue}
o.push(s)}if(ol!==undefined)E.push([ol,'This brace { is never closed','A } is missing further down to close this block']);return o};
const nodes=blk(fl==='logall'||fl==='log+-'?null:fl);

return{E,W,nodes}}
const hw=ns=>ns.some(x=>x.h[0].toLowerCase()==='wait'||hw(x.body||[]));
function chk(ns,E,W,s){for(const x of ns){const k=x.h[0].toLowerCase(),l=x.lg,n=x.n;
if(x.bad){E.push([n,'Incorrect syntax in the instruction',x.why]);continue}
if(!KN.includes(k)){E.push([n,`Unknown instruction: ${x.h[0]}`,sug(x.h[0])||'Instructions: '+KN.join(', ')]);continue}
if(k==='reg'&&l!=='log-')E.push([n,'Reg: is exclusive to Log- (use Screen: or Display:)']);
if(['screen','display','reg'].includes(k)){const p=x.h.map(v=>v.toLowerCase()).find(v=>OPS.includes(v));
if(!p)E.push([n,'Unknown screen operation (Pixel, Rect, Line, Circle, Clear, Resolution)']);
else if(l==='log++')E.push([n,'Log++ has no screen: use Log+ or Log-']);
else if(p==='resolution')s.res=1;
else if(l==='log-'&&!s.res)E.push([n,'Log- requires Resolution before drawing']);}
if(k==='var'){const t=x.h.length>2?x.h[1].toLowerCase():null;
if(l==='log-'&&!t)E.push([n,'Log- requires a type: Var:U8:name("Value;0")']);
if(t&&!TYP.includes(t))E.push([n,`Unknown type: ${x.h[1]} (use U8, U16, U32, I32, F32, F64 or STR)`]);
if(t&&l==='log+')W.push([n,`Log+ infers the type: you can remove ${x.h[1]}`])}
if(k==='expect'&&l!=='log-')E.push([n,'Expect is exclusive to Log-']);
if(k==='loop'&&(x.h.length===1||x.h[1].toLowerCase()==='forever')&&!hw(x.body||[]))W.push([n,'Loop without Wait: the CPU will stay at 100%']);
if(x.body)chk(x.body,E,W,s);if(x.alt)chk(x.alt,E,W,s)}}
/* ---------- intérprete ---------- */
const MO={};Object.getOwnPropertyNames(Math).forEach(m=>{MO[m]=Math[m]});
function ev(e){let f=CC[e];if(!f){try{f=CC[e]=new Function('H','M','V','with(H){with(M){with(V){return('+e+')}}}')}catch(_){throw 'Invalid expression: '+e}}
try{return f(HF,MO,V)}catch(_){throw 'Could not evaluate: '+e}}
const fm=s=>s.replace(/\{([^}]+)\}/g,(_,e)=>ev(e));
const kv=a=>{const r={};a.slice(1).forEach(p=>{const[m,v]=p.split('=');r[m.trim().toUpperCase()]=ev(v)});return r};

'kernel.log-':`<log->
// KERNEL.LOG- v3 - minimal operating system for Log OS
// Run it with:  run # kernel.log-   (kernel mode)   |   auto-boot:  boot kernel.log-
// It has its own VIRTUAL DISK, isolated from the simulator files (see: vd ls).
// Inputs: Keyboard and Mouse buttons below the screen, or touch the screen.
// Memory: 0x0010 ticks (32 bits)  |  0x0100 process table (16 bytes each)
Screen:Resolution("W;318","H;180","Bits;24")
Console:Init("Cols;53","Rows;20","Color;#9be7b4","Bg;#04110a")
Var:U32:ticks("Value;0")
Var:U8:procs("Value;0")
Var:I32:exitcode("Value;0")
Var:I32:ok("Value;0")
Var:I32:alive("Value;1")
Var:I32:mode("Value;0")
Var:I32:mx("Value;159")
Var:I32:my("Value;90")
Var:I32:mb("Value;0")
Var:I32:ox("Value;159")
Var:I32:oy("Value;90")
Var:STR:cmdline("Text;")
Var:STR:cmd("Text;")
Var:STR:rest("Text;")
Var:STR:arg("Text;")
Var:STR:arg2("Text;")
Var:STR:txt("Text;")
Var:STR:path("Text;")
Var:STR:err("Text;")
Var:STR:filelist("List;")
Var:STR:joblist("List;")
Var:I32:info("Dict;")

// kernel service: registers a process in the table (0x0100)
Def:spawn(appname)
{
    Mem:Write("Addr;256+procs*16","Value;procs+1")
    Mem:Write("Addr;257+procs*16","Value;1")
    Mem:WriteText("Addr;258+procs*16","Text;{appname}")
    Set:procs("Value;procs+1")
}

// kernel service: erases the previous cursor and draws the new one
Def:cursor()
{
    Screen:Rect(ox-1,oy-1,12,16)("Color;#000000")
    Screen:Rect(0,0,60,10)("Color;#000000")
    Screen:Line(mx,my,mx,my+11)("Color;#ffffff")
    Screen:Line(mx,my,mx+8,my+8)("Color;#ffffff")
    Screen:Line(mx,my+11,mx+3,my+8)("Color;#ffffff")
    Screen:Line(mx+3,my+8,mx+8,my+8)("Color;#ffffff")
    Screen:Text(2,1)("Text;{mx},{my}","Color;#9be7b4")
    Set:ox("Value;mx")
    Set:oy("Value;my")
}

// kernel service: looks for an app on the disk and leaves its path in 'path'
Def:findapp(appname)
{
    Set:path("Text;")
    Disk:Exists("File;{appname}","Into;ok")
    If(ok==1)
    {
        Set:path("Text;{appname}")
        Return
    }
    Disk:Exists("File;bin/{appname}","Into;ok")
    If(ok==1)
    {
        Set:path("Text;bin/{appname}")
        Return
    }
    Disk:Exists("File;bin/{appname}.log+","Into;ok")
    If(ok==1)
    {
        Set:path("Text;bin/{appname}.log+")
    }
}

// clock interrupt: once per second
On:Timer("Every;1000")
{
    Set:ticks("Value;ticks+1")
    Mem:Write("Addr;16","Value;ticks","Size;4")
}

// mouse and keyboard interrupts
On:Mouse("Move")
{
    If(mode==1)
    {
        Call:cursor()
    }
}
On:Mouse("Down")
{
    If(mode==1&&mb==2)
    {
        Set:mode("Value;0")
        Console:Refresh
    }
}
On:Key("Down")
{
    If(mode==1&&key=='Escape')
    {
        Set:mode("Value;0")
        Console:Refresh
    }
}

// ---- boot ----
Console:Print("Text;LOGOS 0.3 - kernel in Log-","Color;#ffffff")
Wait("ms;300")
Console:Print("Text;CPU 3.0 GHz ............ OK")
Mem:Fill("Addr;1024","Len;4096","Value;170")
Mem:Read("Addr;3000","Into;ok")
If(ok!=170)
{
    Panic("Text;memory test failed")
}
Mem:Fill("Addr;1024","Len;4096","Value;0")
Console:Print("Text;RAM 1024 KB ........... OK")
Wait("ms;300")
Disk:List("Into;filelist")
Console:Print("Text;Virtual disk: {filelist.length} files ... OK")
Console:Print("Text;Mouse and keyboard ..... OK")
Call:spawn('init')
Call:spawn('shell')
Try
{
    Disk:Read("File;etc/motd.txt","Into;txt")
    Console:Print("Text;{txt}","Color;#ffd479")
}
Catch:err
{
}
Console:Print("Text;Type help to see the commands.")
Console:Print("Text;")

// ---- shell ----
While(alive)
{
    If(mode==1)
    {
        Wait("ms;30")
        Continue
    }
    Console:Read("Into;cmdline","Prompt;logos>")
    Set:cmd("Value;cmdline.trim().split(' ')[0].toLowerCase()")
    Set:rest("Value;cmdline.trim().split(' ').slice(1).join(' ')")
    Set:arg("Value;rest.split(' ')[0]")
    Set:arg2("Value;rest.split(' ').slice(1).join(' ')")
    If(cmd=='')
    {
        Continue
    }
    Try
    {
        If(cmd=='help')
        {
            Console:Print("Text;help version clear echo mem ps jobs uptime date sys")
            Console:Print("Text;ls cat write append rm cp mv df import export hostls")
            Console:Print("Text;run bg kill mouse gui panic halt")
        }
        ElseIf(cmd=='version')
        {
            Console:Print("Text;LOGOS 0.3 (kernel written in Log-)")
        }
        ElseIf(cmd=='clear')
        {
            Console:Clear
        }
        ElseIf(cmd=='echo')
        {
            Console:Print("Text;{rest}")
        }
        ElseIf(cmd=='date')
        {
            Console:Print("Text;{new Date().toLocaleString()}")
        }
        ElseIf(cmd=='uptime')
        {
            Console:Print("Text;up for {ticks} s")
        }
        ElseIf(cmd=='sys')
        {
            Sys("Into;info")
            Console:Print("Text;{info.cpu}  RAM {info.ram_mb} MB")
            Console:Print("Text;memory {info.mem_bytes} bytes  screen {info.width}x{info.height}")
            Console:Print("Text;active tasks: {info.tasks}  version {info.version}")
        }
        ElseIf(cmd=='mem')
        {
            Mem:Read("Addr;16","Into;ok","Size;4")
            Console:Print("Text;RAM total: 1024 KB")
            Console:Print("Text;ticks stored at 0x10: {ok}")
            Console:Print("Text;process table (0x100): {procs} entries")
        }
        ElseIf(cmd=='ps')
        {
            Console:Print("Text;PID  STATE  NAME")
            For:p(0,procs)
            {
                Console:Print("Text;{peek(256+p*16)}    {peek(257+p*16)}       {peekstr(258+p*16)}")
            }
        }
        ElseIf(cmd=='jobs')
        {
            Proc:List("Into;joblist")
            Console:Print("Text;in background: {joblist.length}")
            Each:j(joblist)
            {
                Console:Print("Text;  {j}")
            }
        }
        ElseIf(cmd=='ls')
        {
            Disk:List("Prefix;{rest}","Into;filelist")
            Each:f(filelist)
            {
                Disk:Size("File;{f}","Into;ok")
                Console:Print("Text;  {f}  ({ok} B)")
            }
        }
        ElseIf(cmd=='cat')
        {
            Disk:Read("File;{arg}","Into;txt")
            Console:Print("Text;{txt}")
        }
        ElseIf(cmd=='write')
        {
            Disk:Write("File;{arg}","Text;{arg2}")
        }
        ElseIf(cmd=='append')
        {
            Disk:Append("File;{arg}","Text;{arg2}")
        }
        ElseIf(cmd=='rm')
        {
            Disk:Delete("File;{arg}")
        }
        ElseIf(cmd=='cp')
        {
            Disk:Copy("File;{arg}","To;{arg2}")
        }
        ElseIf(cmd=='mv')
        {
            Disk:Rename("File;{arg}","To;{arg2}")
        }
        ElseIf(cmd=='df')
        {
            Disk:List("Into;filelist")
            Disk:Usage("Into;ok")
            Console:Print("Text;{filelist.length} files, {ok} bytes on the virtual disk")
        }
        ElseIf(cmd=='hostls')
        {
            Host:List("Into;joblist")
            Each:f(joblist)
            {
                Console:Print("Text;  {f}")
            }
        }
        ElseIf(cmd=='import')
        {
            Host:Read("File;{arg}","Into;txt")
            Disk:Write("File;{arg}","Text;{txt}")
            Console:Print("Text;imported {arg}")
        }
        ElseIf(cmd=='export')
        {
            Disk:Read("File;{arg}","Into;txt")
            Host:Write("File;{arg}","Text;{txt}")
            Console:Print("Text;exported {arg}")
        }
        ElseIf(cmd=='run')
        {
            Call:findapp(arg)
            If(path=='')
            {
                Console:Print("Text;run: no such app {arg}","Color;#ff7b7b")
            }
            Else
            {
                Call:spawn(arg)
                Exec("File;{path}","Args;{arg2}","Into;exitcode")
                Console:Refresh
                Console:Print("Text;process {arg} finished with code {exitcode}")
                Set:procs("Value;procs-1")
            }
        }
        ElseIf(cmd=='bg')
        {
            Call:findapp(arg)
            If(path=='')
            {
                Console:Print("Text;bg: no such app {arg}","Color;#ff7b7b")
            }
            Else
            {
                Exec("File;{path}","Args;{arg2}","Bg;1","Id;{arg}")
                Console:Print("Text;{arg} runs in the background (jobs, kill {arg})")
            }
        }
        ElseIf(cmd=='kill')
        {
            Kill("Id;{arg}")
            Console:Print("Text;stop requested for {arg}")
        }
        ElseIf(cmd=='mouse')
        {
            Console:Print("Text;mouse at {mx},{my} button {mb}")
        }
        ElseIf(cmd=='gui')
        {
            Set:mode("Value;1")
            Set:ox("Value;mx")
            Set:oy("Value;my")
            Screen:Clear("Color;#000000")
            Screen:Text(2,170)("Text;Esc or right click: exit","Color;#7f8c85")
            Call:cursor()
        }
        ElseIf(cmd=='panic')
        {
            Panic("Text;panic requested from the shell")
        }
        ElseIf(cmd=='halt')
        {
            Console:Print("Text;Shutting down the system...")
            Wait("ms;600")
            Stop
        }
        Else
        {
            Console:Print("Text;unknown command: {cmd}","Color;#ff7b7b")
        }
    }
    Catch:err
    {
        Console:Print("Text;error: {err}","Color;#ff7b7b")
    }
}

const CIRSEED={"Circuit_Programs/README.txt": "Circuit_Programs - examples for Circuits mode (Circuits button or command: circ)\nAll of them use the default board (32 GPIO, 5V, 3V3, GND). Press \"Simulate\" to power it.\nblink.log++            LED on G13. Circuit: \"Example\" button (G13 -> LED -> 220 ohm -> GND)\ntraffic_light.log++    3 LEDs on G2 (red), G3 (yellow), G4 (green), each with a resistor to GND\nbinary_counter.log++   8 LEDs on G0..G7 (with resistors to GND) count in binary\nbutton_led.log++       Push button between 3V3 and G14; LED with resistor on G13\nlcd_i2c.log++          LCD 16x2 (address 0x27): GND-GND, VCC-3V3, SCL-G22, SDA-G21 - one I2C:Write\nlcd_counter.log++      Same LCD wiring: a counter with a variable, cursor placed with Bytes;11,col,row\noled_i2c.log++         OLED 128x64 (address 0x3C), same wiring - text and pixels with I2C:Write\nhdmi_panel.logall      Press START_BUTTON (pin 5): draws on the HDMI and turns on G13\ni2c_scan.log++         LCD + OLED on the same bus: I2C:Scan lists their addresses\nI2C in Log++:  I2C:Write(\"Addr;0x27\",\"Text;Hi\\nthere\",\"Byte;65\",\"Bytes;27,10,20\",\"Into;ack\")  (ack = 1 if the device answered)\nI2C:Scan(\"Into;list\") returns the addresses that answer. Display bytes: 12 clear, 11 col row = move cursor, 10 new line, 13 start of line, 32-126 characters; OLED: 27 x y toggles a pixel.\nYour own circuits: \"My circuits\" menu in Circuits mode. They are saved in the Circuits/ folder (.circ files) together with the last program you ran.\nThe START button in the header = START_BUTTON (pin 5) without leaving Circuits mode.\n", "Circuit_Programs/blink.log++": "<log++>\n// Blink: LED + resistor on G13 (\"Example\" button of Circuits mode)\nSetup\n{\n    Pin:13(\"Output\")\n    Print(\"Blinking on G13\")\n}\nLoop\n{\n    Pin:13(\"Set;High\")\n    Wait(\"ms;400\")\n    Pin:13(\"Set;Low\")\n    Wait(\"ms;400\")\n}\n", "Circuit_Programs/traffic_light.log++": "<log++>\n// Traffic light: red G2, yellow G3, green G4 (each LED with its resistor to GND)\nSetup\n{\n    Pin:2(\"Output\")\n    Pin:3(\"Output\")\n    Pin:4(\"Output\")\n}\nLoop\n{\n    Pin:2(\"Set;High\")\n    Wait(\"ms;1500\")\n    Pin:2(\"Set;Low\")\n    Pin:4(\"Set;High\")\n    Wait(\"ms;1500\")\n    Pin:4(\"Set;Low\")\n    Pin:3(\"Set;High\")\n    Wait(\"ms;600\")\n    Pin:3(\"Set;Low\")\n}\n", "Circuit_Programs/binary_counter.log++": "<log++>\n// Binary counter on 8 LEDs: G0 (least significant bit) to G7\nSetup\n{\n    Pin:0(\"Output\")\n    Pin:1(\"Output\")\n    Pin:2(\"Output\")\n    Pin:3(\"Output\")\n    Pin:4(\"Output\")\n    Pin:5(\"Output\")\n    Pin:6(\"Output\")\n    Pin:7(\"Output\")\n    Var:U8:n(\"Value;0\")\n}\nLoop\n{\n    Pin:0(\"Set;Low\")\n    Pin:1(\"Set;Low\")\n    Pin:2(\"Set;Low\")\n    Pin:3(\"Set;Low\")\n    Pin:4(\"Set;Low\")\n    Pin:5(\"Set;Low\")\n    Pin:6(\"Set;Low\")\n    Pin:7(\"Set;Low\")\n    If((n&1)!=0)\n    {\n        Pin:0(\"Set;High\")\n    }\n    If((n&2)!=0)\n    {\n        Pin:1(\"Set;High\")\n    }\n    If((n&4)!=0)\n    {\n        Pin:2(\"Set;High\")\n    }\n    If((n&8)!=0)\n    {\n        Pin:3(\"Set;High\")\n    }\n    If((n&16)!=0)\n    {\n        Pin:4(\"Set;High\")\n    }\n    If((n&32)!=0)\n    {\n        Pin:5(\"Set;High\")\n    }\n    If((n&64)!=0)\n    {\n        Pin:6(\"Set;High\")\n    }\n    If((n&128)!=0)\n    {\n        Pin:7(\"Set;High\")\n    }\n    Wait(\"ms;150\")\n    Set:n(\"Value;n+1\")\n}\n", "Circuit_Programs/button_led.log++": "<log++>\n// Push button between 3V3 and G14; LED (with resistor) on G13\nSetup\n{\n    Pin:14(\"Input;PullDown\")\n    Pin:13(\"Output\")\n}\nLoop\n{\n    Pin:13(\"Set;Low\")\n    If(pin(14)==1)\n    {\n        Pin:13(\"Set;High\")\n    }\n    Wait(\"ms;10\")\n}\n", "Circuit_Programs/lcd_i2c.log++": "<log++>\n// LCD 16x2 over I2C (SDA=G21, SCL=G22, address 0x27)\n// Connect: GND-GND, VCC-3V3, SCL-G22, SDA-G21\n// In Text: \\f clears the screen and \\n starts a new line\nSetup\n{\n    Var:ack(\"Value;0\")\n    I2C:Write(\"Addr;0x27\",\"Text;\\fLog OS\\nI2C 0x27\",\"Into;ack\")\n    Print(\"ACK from 0x27: {ack}\")\n}\n", "Circuit_Programs/oled_i2c.log++": "<log++>\n// OLED 128x64 over I2C (SDA=G21, SCL=G22, address 0x3C)\n// Connect: GND-GND, VCC-3V3, SCL-G22, SDA-G21\n// Bytes;27,x,y toggles the pixel (x,y); text goes through Text\nSetup\n{\n    I2C:Write(\"Addr;0x3C\",\"Text;\\fLOG-SoC\\nOLED over I2C\")\n    For:i(0,40)\n    {\n        I2C:Write(\"Addr;0x3C\",\"Bytes;27,i*3,30+i/2\")\n    }\n    Print(\"OLED updated\")\n}\n", "Circuit_Programs/hdmi_panel.logall": "<logall>\n// Press START (button of the Circuits panel or of the output panel): draws on the HDMI and turns on G13\n#++ Setup\n{\n    Pin:13(\"Output\")\n}\n#- Screen:Resolution(\"W;160\",\"H;90\",\"Bits;24\")\n#+ Screen:Clear(\"Color;rgb;10;20;60\")\n#+ Screen:Rect(10,10,140,70)(\"Color;rgb;30;60;120\")\n#+ On:START_BUTTON(\"Press\")\n{\n    Screen:Rect(20,20,120,50)(\"Color;rgb;0;180;90\")\n    #++ Pin:13(\"Set;High\")\n    Print(\"HDMI ready and LED G13 on\")\n}\n", "Circuit_Programs/.dir": "", "Circuit_Programs/lcd_counter.log++": "<log++>\n// LCD 16x2 over I2C: a counter updated every second\n// Connect: GND-GND, VCC-3V3, SCL-G22, SDA-G21\n// Bytes;11,col,row moves the cursor\nSetup\n{\n    Var:n(\"Value;0\")\n    I2C:Write(\"Addr;0x27\",\"Text;\\fLog OS counter\")\n}\nLoop\n{\n    I2C:Write(\"Addr;0x27\",\"Bytes;11,0,1\",\"Text;Count: {n}   \")\n    Set:n(\"Value;n+1\")\n    Wait(\"ms;1000\")\n}\n", "Circuit_Programs/i2c_scan.log++": "<log++>\n// I2C scan: lists the devices that answer on the bus (G21 = SDA, G22 = SCL)\n// Circuit: the \"I2C scan\" example (LCD + OLED on the same bus)\nSetup\n{\n    Var:found(\"List;\")\n    I2C:Scan(\"Into;found\")\n    Print(\"Devices found: {found.length}\")\n    Each:a(found)\n    {\n        Print(\"  address 0x{a.toString(16)}\")\n    }\n}\n"};
